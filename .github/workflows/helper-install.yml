name: Helper installation

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Helpers on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm run verify:helpers
