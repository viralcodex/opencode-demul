name: PR approval
run-name: "Approve PR #${{ github.event.pull_request.number }} at ${{ github.event.review.commit_id }}"

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.review.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - run: "true"
