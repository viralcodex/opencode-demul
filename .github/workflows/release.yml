name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json, without the v prefix
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = process.env.VERSION;
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/);
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(version, manifest.version, 'Commit the package version before releasing.');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          NODE
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              await github.rest.git.getRef({
                ...context.repo, ref: `tags/${process.env.RELEASE_TAG}`,
              });
              core.setFailed('This release tag already exists. Choose a new package version.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  validate:
    needs: prepare
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: package
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" package/*.tgz "${args[@]}"
